plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.panel.cheat'
    compileSdk 33
    ndkVersion "25.2.9519653"
    defaultConfig { 
        applicationId "com.panel.cheat"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0"
        externalNativeBuild { cmake { cppFlags "" } }
    }
    buildTypes { 
        release { 
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' 
        } 
    }
    externalNativeBuild { 
        cmake { path "CMakeLists.txt"; version "3.22.1" } 
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies { implementation 'androidx.core:core-ktx:1.10.1'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.9.0' }
